# Update test.yml to validate Eclipse Hono instead of KubeEdge
on:
  workflow_run:
    workflows: ["Pulumi CI with kind"]
    types:
      - completed

jobs:
  verify-services:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up kind
        uses: engineerd/setup-kind@v0.5.0
        with:
          version: v0.20.0

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Wait for services to be ready
        run: |
          kubectl wait --for=condition=available --timeout=180s deployment --all -n istio-system
          kubectl wait --for=condition=available --timeout=180s deployment --all -n grafana
          kubectl wait --for=condition=available --timeout=180s deployment --all -n backstage
          kubectl wait --for=condition=available --timeout=180s deployment --all -n hono

      - name: Verify service endpoints
        run: |
          kubectl get svc -A

      - name: Port-forward and check availability
        run: |
          kubectl port-forward svc/istio-ingressgateway -n istio-system 15014:15014 &
          kubectl port-forward svc/grafana -n grafana 3000:3000 &
          kubectl port-forward svc/backstage -n backstage 7000:7000 &
          kubectl port-forward svc/hono -n hono 8080:8080 &
          sleep 20

          curl -f http://localhost:15014 || exit 1
          curl -f http://localhost:3000 || exit 1
          curl -f http://localhost:7000 || exit 1
          curl -f http://localhost:8080 || exit 1
